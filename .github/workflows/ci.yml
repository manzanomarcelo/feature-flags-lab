name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  node-ci:
    name: Node.js CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Create reports folder
        run: mkdir -p reports

      - name: Run lint
        run: npm run lint

      - name: Run tests and save output
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee reports/test-output.txt

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: reports/test-output.txt
